<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>MiniDayZ 设置</title><link rel="stylesheet" href="settings.css"></head><body><header><span class="eyebrow">MINIDAYZ CANGSHU PC</span><h1>设置与存档</h1><p>完全本地运行 · F2 打开设置</p></header><main><div id="warnings" role="status"></div><section><h2>游戏设置</h2><label><input id="keyboardControls" type="checkbox">启用 PC 键盘控制 <small>立即生效</small></label><label><input id="startFullscreen" type="checkbox">启动时全屏 <small>下次启动生效</small></label><label><input id="autoBackup" type="checkbox">自动备份存档</label><label>最多保留自动备份 <input id="maxBackups" type="number" min="1" max="100" step="1"> <small>1–100；手动备份不受轮换影响</small></label><button id="saveSettings">保存设置</button><p id="overrideNote"></p></section><section><div class="section-title"><h2>键盘控制</h2><button id="resetControls" class="secondary">恢复默认键位</button></div><p>点击键位后按下新按键。重复键位和应用快捷键会被拒绝。</p><div id="bindings"></div></section><section><h2>存档管理</h2><p>导出和备份保存最近已写入的存档。要保留当前游戏进度，请先在游戏中使用 Save and Exit。</p><div class="buttons"><button id="exportSave">导出存档</button><button id="importSave">导入存档</button><button id="backupNow">立即备份</button><button id="openSaveFolder" class="secondary">打开存档目录</button><button id="openBackupFolder" class="secondary">打开备份目录</button></div><p>导入或恢复会重新打开游戏页，并先保存当前存档的备份。存档不会上传到网络。</p><div class="section-title"><h3>恢复备份</h3><button id="refreshBackups" class="secondary">刷新</button></div><div id="backups"></div></section><section><h2>关于</h2><dl><dt>游戏版本</dt><dd id="gameVersion"></dd><dt>桌面版本</dt><dd id="desktopVersion"></dd><dt>离线模式</dt><dd>已启用</dd><dt>配置文件</dt><dd id="settingsPath"></dd><dt>备份目录</dt><dd id="backupPath"></dd></dl></section></main><footer><div id="status" role="status" aria-live="polite">正在读取设置…</div></footer><script src="settings.js"></script></body></html>
